name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Build .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore JobTracker.Api
      - name: Build
        run: dotnet build JobTracker.Api --configuration Release --no-restore

  ui:
    name: Build Angular UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobtracker-ui/package-lock.json
      - name: Install packages
        run: npm ci
        working-directory: jobtracker-ui
      - name: Build
        run: npm run build
        working-directory: jobtracker-ui

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images with Compose
        run: docker compose build