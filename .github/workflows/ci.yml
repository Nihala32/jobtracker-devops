name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Build .NET API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore JobTracker.Api
      - name: Build
        run: dotnet build JobTracker.Api --configuration Release --no-restore

  ui:
    name: Build Angular UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobtracker-ui/package-lock.json
      - name: Install packages
        run: npm ci
        working-directory: jobtracker-ui
      - name: Build
        run: npm run build
        working-directory: jobtracker-ui

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images with Compose
        run: docker compose build

  publish:
    name: Publish images to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./JobTracker.Api
          push: true
          tags: |
            ghcr.io/nihala32/jobtracker-api:latest
            ghcr.io/nihala32/jobtracker-api:${{ github.sha }}
      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: ./jobtracker-ui
          push: true
          tags: |
            ghcr.io/nihala32/jobtracker-ui:latest
            ghcr.io/nihala32/jobtracker-ui:${{ github.sha }}